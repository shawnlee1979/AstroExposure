name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships an Android SDK (ANDROID_HOME preset) but only
      # guarantees older platforms; the project compiles against SDK 35
      # (0.17.0), so install that platform explicitly with the image's own
      # sdkmanager. A third-party setup action was tried in the past and its
      # step failed before any project code ran, so this stays a plain
      # run step on the preset SDK.
      - name: Install Android SDK platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"

      - name: Unit and contract tests
        run: ./gradlew :domain:test :data:test

      - name: Lint and release build
        # Unsigned without key.properties (developer-only signing material);
        # this step proves the release variant assembles from a clean tree.
        run: ./gradlew lint assembleRelease
