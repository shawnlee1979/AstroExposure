name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No SDK setup step: GitHub's ubuntu runner images ship an Android SDK
      # (ANDROID_HOME is preset, platform 34 + build-tools included), which
      # AGP picks up automatically. A third-party setup action was tried
      # first and its step failed before any project code ran, so the build
      # relies on the runner image instead.

      - name: Unit and contract tests
        run: ./gradlew :domain:test :data:test

      - name: Lint and release build
        # Unsigned without key.properties (developer-only signing material);
        # this step proves the release variant assembles from a clean tree.
        run: ./gradlew lint assembleRelease
