org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The in-process Kotlin compiler shares the daemon JVM; the phase-2 :app
# module (Compose + Room) blows the default 384 MB metaspace ceiling on a
# clean CI run (OutOfMemoryError: Metaspace during IR lowering).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
# Compile Kotlin in-process: this dev sandbox cannot keep forked daemons alive.
kotlin.compiler.execution.strategy=in-process
